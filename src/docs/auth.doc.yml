paths:
  /auth/sign-up:
    post:
      tags:
        - Auth
      summary: Créer un nouveau compte utilisateur
      description: Inscription d'un nouvel utilisateur avec email, nom d'utilisateur et mot de passe. Retourne un token JWT pour l'authentification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - username
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "trainer@pokemon.com"
                  description: Adresse email unique
                username:
                  type: string
                  example: "pikachu_trainer"
                  description: Nom d'utilisateur
                password:
                  type: string
                  format: password
                  example: "SecurePass123!"
                  description: Mot de passe (sera hashé)
      responses:
        201:
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        400:
          description: Données manquantes ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Données manquantes"
        409:
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Email déjà utilisé"
        500:
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Erreur serveur"

  /auth/sign-in:
    post:
      tags:
        - Auth
      summary: Se connecter
      description: Authentification d'un utilisateur existant. Retourne un token JWT valide pour 7 jours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "trainer@pokemon.com"
                  description: Adresse email du compte
                password:
                  type: string
                  format: password
                  example: "SecurePass123!"
                  description: Mot de passe du compte
      responses:
        200:
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        400:
          description: Données manquantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Données manquantes"
        401:
          description: Email ou mot de passe incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Email ou mot de passe incorrect"
        500:
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Erreur serveur"
