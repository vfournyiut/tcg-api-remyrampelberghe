paths:
  /cards:
    get:
      tags:
        - Cards
      summary: Récupérer toutes les cartes
      description: Retourne la liste complète de toutes les cartes Pokémon disponibles, triées par numéro de Pokédex croissant. Cette route est publique et ne nécessite pas d'authentification.
      responses:
        200:
          description: Liste des cartes récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              example:
                - id: 1
                  name: "Pikachu"
                  hp: 60
                  attack: 55
                  type: "Electric"
                  pokedexNumber: 25
                  imgUrl: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png"
                  createdAt: "2026-01-20T12:00:00.000Z"
                  updatedAt: "2026-01-20T12:00:00.000Z"
                - id: 2
                  name: "Charizard"
                  hp: 120
                  attack: 84
                  type: "Fire"
                  pokedexNumber: 6
                  imgUrl: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/006.png"
                  createdAt: "2026-01-20T12:00:00.000Z"
                  updatedAt: "2026-01-20T12:00:00.000Z"
                - id: 3
                  name: "Blastoise"
                  hp: 110
                  attack: 83
                  type: "Water"
                  pokedexNumber: 9
                  imgUrl: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/009.png"
                  createdAt: "2026-01-20T12:00:00.000Z"
                  updatedAt: "2026-01-20T12:00:00.000Z"
        500:
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Erreur serveur"
